name: Report System checks
on:
  push:
    branches: [main, release/promote-v2-to-root]
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "js/**"
      - "tests/**"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/v2-tests.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check js/engine.js
          node --check js/csv.js
          node --check js/xlsx.js
          node --check js/storage.js
          node --check js/library-backup.js
          node --check js/app-v3.js
      - name: Engine regression tests
        run: node --test tests/*.test.js
      - name: Install browser test dependencies
        working-directory: .
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Browser regression tests
        working-directory: .
        run: npm run test:browser
