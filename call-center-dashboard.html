<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تقرير أداء مركز الاتصال</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --primary: #1f4e79;
      --secondary: #2f6fa6;
      --text: #1d2733;
      --muted: #6c7a89;
      --warning: #f9c74f;
      --danger: #e76f51;
      --ok: #2a9d8f;
      --border: #dce3ec;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      direction: rtl;
      text-align: right;
      font-family: "Tajawal", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px 32px; }
    .header, .panel, .section { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); border: 1px solid var(--border); }
    .header { padding: 18px 24px; margin-bottom: 18px; }
    h1 { margin: 0 0 8px; color: var(--primary); font-size: clamp(1.3rem, 2vw, 2rem); }
    .meta { color: var(--muted); font-size: 0.95rem; }
    .panel { padding: 16px; margin-bottom: 18px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn {
      border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font-weight: 600;
      background: var(--primary); color: #fff;
    }
    .btn:hover { background: var(--secondary); }
    .btn.secondary { background: #3c4f65; }
    .hint { color: var(--muted); font-size: .9rem; }
    input[type="file"] { border: 1px dashed var(--border); padding: 8px; border-radius: 8px; background: #fff; }
    .status { margin-top: 10px; font-weight: 600; }
    .status.error { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .section { padding: 14px; margin-bottom: 14px; }
    .section h2 { margin: 0 0 12px; font-size: 1.2rem; color: var(--primary); }
    .report-header-card { background: linear-gradient(135deg,#f5f9ff,#ffffff); border: 1px solid #d8e7f6; border-radius: 12px; padding: 14px 16px; }
    .report-header-title { margin: 0 0 8px; color: var(--primary); font-size: 1.2rem; font-weight: 700; }
    .report-header-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px 12px; font-size: .92rem; color: #334155; }
    .report-header-meta .label { font-weight: 700; color: #1e3a5f; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .kpi-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; background: linear-gradient(180deg, #fff, #f9fbff); min-height: 138px; text-align: center; line-height: 1.5; word-break: normal; white-space: normal; display: flex; flex-direction: column; justify-content: center; }
    .kpi-title-ar { display:block; font-size: 13px; font-weight: 700; color: #0f2940; }
    .kpi-title-en { display:block; font-size: 10px; color:#64748b; direction:ltr; text-align:center; margin-top:4px; }
    .kpi-value { font-size: 22px; font-weight: 800; color: var(--primary); margin-top: 8px; line-height: 1.3; }
    .kpi-unit { font-size: 11px; color:#64748b; margin-top: 4px; }
    .summary-box { background: #f7fbff; border: 1px solid #d8e7f6; border-radius: 10px; padding: 12px; }
    .charts-grid { display:grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .chart-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .chart-card.wide { grid-column: 1 / -1; max-width: 70%; margin-inline:auto; }
    .chart-card canvas { width: 100% !important; height: 220px !important; }
    .table-wrap { width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; table-layout: fixed; }
    th, td { border: 1px solid var(--border); padding: 8px; text-align: center; white-space: normal; line-height: 1.35; }
    td { word-break: break-word; }
    th { background: #eef4fb; color: var(--primary); position: sticky; top: 0; z-index: 1; }
    tr:nth-child(even) { background: #fbfdff; }
    .flag-low { background: rgba(231,111,81,.18); font-weight: 600; }
    .flag-mid { background: rgba(249,199,79,.25); font-weight: 600; }
    .hidden { display: none; }
    .data-table-wrapper,
    .kpi-card,
    .chart-card,
    .summary-card,
    table,
    tr,
    canvas {
      page-break-inside: avoid;
      break-inside: avoid;
    }
    .charts-section { page-break-before: auto; }
    #reportContent { max-width: 198mm; margin: 0 auto; }
    .exporting-pdf .controls,
    .exporting-pdf .upload-section,
    .exporting-pdf .no-print {
      display: none !important;
    }
    .exporting-pdf #reportContent {
      width: 198mm;
      max-width: 198mm;
      margin: 0 auto;
      background: #fff;
      box-shadow: none;
      padding: 0;
    }
    .exporting-pdf .section {
      margin-bottom: 8px;
      padding: 12px;
    }
    .exporting-pdf .kpi-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .exporting-pdf .kpi-card {
      min-height: auto;
      padding: 10px;
    }
    .exporting-pdf .report-section,
    .exporting-pdf .chart-card,
    .exporting-pdf .kpi-card,
    .exporting-pdf .summary-card {
      break-inside: avoid;
      page-break-inside: avoid;
    }
    .exporting-pdf .charts-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .exporting-pdf .chart-card.wide { grid-column: 1 / -1; max-width: 70%; margin-inline: auto; }
    .exporting-pdf table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: 8.5px;
    }
    .exporting-pdf th,
    .exporting-pdf td {
      padding: 5px 4px;
      white-space: normal;
      word-break: break-word;
      line-height: 1.35;
      text-align: center;
    }
    .exporting-pdf th .ar { display:block; font-weight:700; }
    .exporting-pdf th .en { display:block; font-size:7px; color:#64748b; direction:ltr; }

    @media (max-width: 720px) {
      .container { margin-top: 12px; }
      .header, .panel, .section { border-radius: 10px; }
      .controls { flex-direction: column; align-items: stretch; }
      .btn { width: 100%; }
      input[type=file] { width: 100%; }
    }

    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; }
      .container { max-width: 100%; margin: 0; padding: 0; }
      .header, .panel, .section { box-shadow: none; border: 1px solid #bbb; margin-bottom: 10px; break-inside: avoid; }
      .no-print { display: none !important; }
      .charts-grid { grid-template-columns: 1fr; }
      table { font-size: 10px; table-layout: fixed; }
      th { position: static; }
    }
    @media (max-width: 900px) {
      .charts-grid { grid-template-columns: 1fr; }
      .chart-card.wide { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container" id="reportRoot">
    <div class="header">
      <h1>تقرير أداء مركز الاتصال</h1>
      <div class="meta">تاريخ توليد التقرير: <span id="generatedDate"></span></div>
    </div>

    <div class="panel no-print">
      <div class="controls">
        <input type="file" id="csvFileInput" accept=".csv,text/csv" />
        <button class="btn" id="loadBtn">تحميل البيانات</button>
        <button class="btn secondary" id="printBtn">تصدير PDF</button>
      </div>
      <div class="hint">ارفع ملف CSV لعرض التقرير.</div>
      <div id="status" class="status"></div>
    </div>

    <div id="reportContent" class="hidden">
      <section class="section report-section report-header-card">
        <h2 class="report-header-title">تقرير أداء مركز الاتصال</h2>
        <div class="report-header-meta">
          <div><span class="label">تاريخ التوليد:</span> <span id="reportGeneratedDate"></span></div>
          <div><span class="label">فترة البيانات:</span> <span id="reportDateRange">—</span></div>
        </div>
      </section>

      <section class="section report-section summary-card">
        <h2>الملخص التنفيذي</h2>
        <div id="executiveSummary" class="summary-box"></div>
      </section>

      <section class="section report-section">
        <h2>مؤشرات الأداء الرئيسية (KPI)</h2>
        <div class="kpi-grid" id="kpiGrid"></div>
      </section>

      <section class="section report-section charts-section">
        <h2>الرسوم البيانية</h2>
        <div class="charts-grid">
          <div class="chart-card"><canvas id="callsChart"></canvas></div>
          <div class="chart-card"><canvas id="answerRateChart"></canvas></div>
          <div class="chart-card wide"><canvas id="comparisonChart"></canvas></div>
        </div>
      </section>

      <section class="section report-section">
        <h2>جدول البيانات</h2>
        <div class="table-wrap data-table-wrapper">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script>
    const REQUIRED_COLUMNS = [
      "Date","Calls","AnsweredCalls","MissedCalls","AnswerRate","AverageSpeed",
      "AverageHandleTime","ServiceLevel","AbandonedCalls","AbandonRate","Notes"
    ];

    const state = { rawRows: [], normalizedRows: [], charts: [] };
    const COLUMN_LABELS = {
      Date: { ar: 'التاريخ', en: 'Date' },
      Calls: { ar: 'المكالمات', en: 'Calls' },
      AnsweredCalls: { ar: 'المجابة', en: 'AnsweredCalls' },
      MissedCalls: { ar: 'الفائتة', en: 'MissedCalls' },
      AnswerRate: { ar: 'معدل الإجابة', en: 'AnswerRate' },
      AverageSpeed: { ar: 'سرعة الرد', en: 'AverageSpeed' },
      AverageHandleTime: { ar: 'مدة المكالمة', en: 'AverageHandleTime' },
      ServiceLevel: { ar: 'مستوى الخدمة', en: 'ServiceLevel' },
      AbandonedCalls: { ar: 'المتروكة', en: 'AbandonedCalls' },
      AbandonRate: { ar: 'معدل الترك', en: 'AbandonRate' },
      Notes: { ar: 'الملاحظات', en: 'Notes' }
    };

    function formatDateTimeNow() {
      return new Date().toLocaleString('ar-SA', { year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function parseCSV(text) {
      const rows = [];
      let current = '', inQuotes = false, row = [];
      for (let i = 0; i < text.length; i++) {
        const ch = text[i], next = text[i + 1];
        if (ch === '"') {
          if (inQuotes && next === '"') { current += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          row.push(current.trim()); current = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(current.trim()); current = '';
          if (row.some(v => v !== '')) rows.push(row);
          row = [];
        } else current += ch;
      }
      if (current.length || row.length) { row.push(current.trim()); if (row.some(v => v !== '')) rows.push(row); }
      return rows;
    }

    function normalizePercent(value) {
      if (value == null || value === '') return null;
      const n = Number(String(value).replace('%', '').trim());
      if (Number.isNaN(n)) return null;
      return n;
    }

    function normalizeNumber(value) {
      if (value == null || value === '') return null;
      const cleaned = String(value).replace(/,/g, '').trim();
      const n = Number(cleaned);
      return Number.isNaN(n) ? null : n;
    }

    function toDisplayPercent(n) { return n == null ? '—' : `${n.toFixed(1)}%`; }
    function toDisplayNumber(n) { return n == null ? '—' : n.toLocaleString('en-US'); }

    function normalizeRow(rowObj) {
      return {
        Date: rowObj.Date || '',
        Calls: normalizeNumber(rowObj.Calls),
        AnsweredCalls: normalizeNumber(rowObj.AnsweredCalls),
        MissedCalls: normalizeNumber(rowObj.MissedCalls),
        AnswerRate: normalizePercent(rowObj.AnswerRate),
        AverageSpeed: normalizeNumber(rowObj.AverageSpeed),
        AverageHandleTime: normalizeNumber(rowObj.AverageHandleTime),
        ServiceLevel: normalizePercent(rowObj.ServiceLevel),
        AbandonedCalls: normalizeNumber(rowObj.AbandonedCalls),
        AbandonRate: normalizePercent(rowObj.AbandonRate),
        Notes: rowObj.Notes || ''
      };
    }

    function setStatus(message, type='ok') {
      const el = document.getElementById('status');
      el.textContent = message;
      el.className = `status ${type}`;
    }

    function mean(values) {
      const valid = values.filter(v => typeof v === 'number' && !Number.isNaN(v));
      if (!valid.length) return null;
      return valid.reduce((a,b)=>a+b,0) / valid.length;
    }

    function buildExecutiveSummary(rows) {
      const days = rows.length;
      const bestCalls = [...rows].filter(r=>r.Calls!=null).sort((a,b)=>b.Calls-a.Calls)[0];
      const avgAnswerRate = mean(rows.map(r=>r.AnswerRate));
      const avgService = mean(rows.map(r=>r.ServiceLevel));
      const avgAbandon = mean(rows.map(r=>r.AbandonRate));

      const issues = [];
      if (avgAnswerRate != null && avgAnswerRate < 90) issues.push('انخفاض متوسط معدل الإجابة عن المستوى المستهدف (90%).');
      if (avgService != null && avgService < 80) issues.push('مستوى الخدمة أقل من الهدف التشغيلي (80%).');
      if (avgAbandon != null && avgAbandon > 5) issues.push('ارتفاع معدل ترك المكالمات فوق الحد المقبول (5%).');

      return `يغطي هذا التقرير عدد ${days} يوم/أيام تشغيلية مسجلة. ` +
        (bestCalls ? `سجّل يوم ${bestCalls.Date} أعلى حجم مكالمات بإجمالي ${toDisplayNumber(bestCalls.Calls)} مكالمة. ` : '') +
        `بلغ متوسط معدل الإجابة ${toDisplayPercent(avgAnswerRate)}، ومتوسط مستوى الخدمة ${toDisplayPercent(avgService)}، فيما بلغ متوسط معدل الترك ${toDisplayPercent(avgAbandon)}. ` +
        (issues.length ? `أبرز الملاحظات: ${issues.join(' ')}` : 'لا توجد مؤشرات حرجة بارزة ضمن الحدود المعتمدة.');
    }

    function renderKPI(rows) {
      const items = [
        { ar: 'إجمالي المكالمات', en: 'Total Calls', value: toDisplayNumber(rows.reduce((s,r)=>s+(r.Calls||0),0)), unit: '' },
        { ar: 'إجمالي المكالمات المجابة', en: 'Answered Calls', value: toDisplayNumber(rows.reduce((s,r)=>s+(r.AnsweredCalls||0),0)), unit: '' },
        { ar: 'إجمالي المكالمات الفائتة', en: 'Missed Calls', value: toDisplayNumber(rows.reduce((s,r)=>s+(r.MissedCalls||0),0)), unit: '' },
        { ar: 'متوسط معدل الإجابة', en: 'Average Answer Rate', value: toDisplayPercent(mean(rows.map(r=>r.AnswerRate))), unit: '' },
        { ar: 'متوسط سرعة الرد', en: 'Average Speed of Answer', value: rows.length ? `${(mean(rows.map(r=>r.AverageSpeed))||0).toFixed(2)}` : '—', unit: rows.length ? 'ثانية' : '' },
        { ar: 'متوسط مدة المكالمة', en: 'Average Handle Time', value: rows.length ? `${(mean(rows.map(r=>r.AverageHandleTime))||0).toFixed(2)}` : '—', unit: rows.length ? 'ثانية' : '' },
        { ar: 'متوسط مستوى الخدمة', en: 'Average Service Level', value: toDisplayPercent(mean(rows.map(r=>r.ServiceLevel))), unit: '' },
        { ar: 'إجمالي المكالمات المتروكة', en: 'Abandoned Calls', value: toDisplayNumber(rows.reduce((s,r)=>s+(r.AbandonedCalls||0),0)), unit: '' },
        { ar: 'متوسط معدل الترك', en: 'Average Abandon Rate', value: toDisplayPercent(mean(rows.map(r=>r.AbandonRate))), unit: '' }
      ];

      const grid = document.getElementById('kpiGrid');
      grid.innerHTML = items.map((item) =>
        `<div class="kpi-card">
          <span class="kpi-title-ar">${item.ar}</span>
          <span class="kpi-title-en">${item.en}</span>
          <div class="kpi-value">${item.value}</div>
          ${item.unit ? `<div class="kpi-unit">${item.unit}</div>` : '<div class="kpi-unit">&nbsp;</div>'}
        </div>`).join('');
    }

    function renderReportHeader(rows) {
      const generatedDate = formatDateTimeNow();
      const dates = rows.map(r => r.Date).filter(Boolean);
      const dateRange = dates.length ? `${dates[0]} ← ${dates[dates.length - 1]}` : '—';
      document.getElementById('reportGeneratedDate').textContent = generatedDate;
      document.getElementById('reportDateRange').textContent = dateRange;
    }

    function destroyCharts() { state.charts.forEach(c => c.destroy()); state.charts = []; }

    function renderCharts(rows) {
      destroyCharts();
      const labels = rows.map(r => r.Date);
      state.charts.push(new Chart(document.getElementById('callsChart'), {
        type: 'bar',
        data: { labels, datasets: [{ label: 'عدد المكالمات', data: rows.map(r => r.Calls), backgroundColor: '#2f6fa6' }] },
        options: { responsive: true, plugins: { legend: { display: true } } }
      }));
      state.charts.push(new Chart(document.getElementById('answerRateChart'), {
        type: 'line',
        data: { labels, datasets: [{ label: 'معدل الإجابة %', data: rows.map(r => r.AnswerRate), borderColor: '#2a9d8f', backgroundColor:'rgba(42,157,143,.2)', tension:.25 }] },
        options: { responsive: true, scales: { y: { suggestedMin: 0, suggestedMax: 100 } } }
      }));
      state.charts.push(new Chart(document.getElementById('comparisonChart'), {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'مجاب', data: rows.map(r => r.AnsweredCalls), backgroundColor: '#1f4e79' },
            { label: 'فائت', data: rows.map(r => r.MissedCalls), backgroundColor: '#e76f51' },
            { label: 'متروك', data: rows.map(r => r.AbandonedCalls), backgroundColor: '#f9c74f' }
          ]
        },
        options: { responsive: true }
      }));
    }

    function renderTable(rows) {
      const head = document.getElementById('tableHead');
      const body = document.getElementById('tableBody');
      head.innerHTML = `<tr>${REQUIRED_COLUMNS.map(c => {
        const label = COLUMN_LABELS[c] || { ar: c, en: c };
        return `<th><span class="ar">${label.ar}</span><span class="en">${label.en}</span></th>`;
      }).join('')}</tr>`;
      body.innerHTML = rows.map(r => {
        const cells = REQUIRED_COLUMNS.map(col => {
          let val = r[col] ?? '';
          if (["AnswerRate","ServiceLevel","AbandonRate"].includes(col)) val = toDisplayPercent(val);
          else if (["Calls","AnsweredCalls","MissedCalls","AverageSpeed","AverageHandleTime","AbandonedCalls"].includes(col)) val = toDisplayNumber(val);
          const cls = (col === 'AnswerRate' && r.AnswerRate != null && r.AnswerRate < 90) ||
                      (col === 'ServiceLevel' && r.ServiceLevel != null && r.ServiceLevel < 80) ||
                      (col === 'AbandonRate' && r.AbandonRate != null && r.AbandonRate > 5)
                      ? 'flag-low' : '';
          return `<td class="${cls}">${val}</td>`;
        }).join('');
        return `<tr>${cells}</tr>`;
      }).join('');
    }

    function mapRowsByHeaders(parsedRows) {
      const headers = parsedRows[0].map(h => h.trim());
      const missing = REQUIRED_COLUMNS.filter(c => !headers.includes(c));
      if (missing.length) throw new Error(`الأعمدة التالية مفقودة: ${missing.join('، ')}`);
      return parsedRows.slice(1).map(row => {
        const obj = {};
        headers.forEach((h, idx) => obj[h] = row[idx] ?? '');
        return obj;
      });
    }

    function handleCSVText(text) {
      if (!text.trim()) throw new Error('الملف فارغ.');
      const parsed = parseCSV(text);
      if (parsed.length < 2) throw new Error('الملف لا يحتوي على بيانات كافية (صف عناوين + صف بيانات على الأقل).');
      const rowObjects = mapRowsByHeaders(parsed);
      const normalized = rowObjects.map(normalizeRow);
      if (!normalized.length) throw new Error('لا توجد صفوف صالحة للعرض.');
      state.rawRows = rowObjects;
      state.normalizedRows = normalized;
      renderReport(normalized);
      setStatus(`تم تحميل ${normalized.length} صف بنجاح.`, 'ok');
    }

    function renderReport(rows) {
      document.getElementById('reportContent').classList.remove('hidden');
      renderReportHeader(rows);
      document.getElementById('executiveSummary').textContent = buildExecutiveSummary(rows);
      renderKPI(rows);
      renderCharts(rows);
      renderTable(rows);
    }

    async function exportReportToPDF() {
      const exportBtn = document.getElementById('printBtn');
      const reportElement = document.getElementById('reportContent');
      const originalLabel = exportBtn.textContent;

      exportBtn.textContent = 'جاري تجهيز PDF...';
      exportBtn.disabled = true;
      document.body.classList.add('exporting-pdf');

      try {
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        state.charts.forEach(chart => chart.resize());

        const options = {
          margin: [6, 6, 6, 6],
          filename: 'call-center-performance-report.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: {
            scale: 2,
            useCORS: true,
            backgroundColor: '#ffffff',
            letterRendering: true,
            scrollY: 0
          },
          jsPDF: {
            unit: 'mm',
            format: 'a4',
            orientation: 'portrait'
          },
          pagebreak: {
            mode: ['css', 'legacy'],
            avoid: ['.kpi-card', '.chart-card', '.summary-card', '.data-table-wrapper', 'tr']
          }
        };

        await html2pdf().set(options).from(reportElement).save();
        setStatus('تم تصدير ملف PDF بنجاح.', 'ok');
      } catch (error) {
        console.error(error);
        setStatus('تعذر التصدير المباشر. سيتم فتح الطباعة كخيار احتياطي.', 'error');
        window.print();
      } finally {
        document.body.classList.remove('exporting-pdf');
        exportBtn.textContent = originalLabel;
        exportBtn.disabled = false;
      }
    }

    function init() {
      document.getElementById('generatedDate').textContent = formatDateTimeNow();
      document.getElementById('loadBtn').addEventListener('click', () => {
        const fileInput = document.getElementById('csvFileInput');
        const file = fileInput.files?.[0];
        if (!file) return setStatus('يرجى اختيار ملف CSV أولًا.', 'error');
        if (!file.name.toLowerCase().endsWith('.csv') && file.type !== 'text/csv') {
          return setStatus('نوع الملف غير مدعوم. يرجى رفع ملف CSV فقط.', 'error');
        }
        const reader = new FileReader();
        reader.onload = () => {
          try { handleCSVText(reader.result); } catch (e) { setStatus(e.message, 'error'); }
        };
        reader.onerror = () => setStatus('حدث خطأ أثناء قراءة الملف.', 'error');
        reader.readAsText(file, 'UTF-8');
      });

      document.getElementById('printBtn').addEventListener('click', async () => {
        if (!state.normalizedRows.length) {
          setStatus('يرجى تحميل البيانات أولًا قبل التصدير.', 'error');
          return;
        }
        await exportReportToPDF();
      });
    }

    init();
  </script>
</body>
</html>
